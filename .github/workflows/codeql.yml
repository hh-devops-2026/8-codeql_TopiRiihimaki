
name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run Docker container
        run: |
          docker run -d \
            --name go-web-server \
            -p 8080:8080 \
            go-web-server

      - name: Test readfile endpoint
        run: |
          for i in $(seq 1 15); do
            if curl --fail \
              "http://localhost:8080/readfile?file=hello.txt"; then
              exit 0
            fi
            sleep 2
          done
          echo "The readfile endpoint test failed"
          docker logs go-web-server
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm -f go-web-server || true
