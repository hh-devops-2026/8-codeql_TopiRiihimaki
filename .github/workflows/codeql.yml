
name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  
  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run Docker container
        run: docker run -d --name go-web-server -p 8080:8080 go-web-server

      - name: Wait for server
        run: |
          sleep 3
          curl --fail http://localhost:8080/readfile?file=safe-files/hello.txt

      - name: Test readfile endpoint
        run: |
          curl --fail http://localhost:8080/readfile?file=safe-files/hello.txt

      - name: Show container logs
        if: always()
        run: docker logs go-web-server || true

      - name: Stop Docker container
        if: always()
        run: docker rm -f go-web-server || true
